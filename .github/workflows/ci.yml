name: WealthTrack Backend CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the matching frontend for the model file
        run: |
          repo=https://github.com/gopichand-retail-apps/wealthtrack-frontend.git
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git ls-remote --exit-code --heads "$repo" "$ref" > /dev/null || ref=main
          git clone --depth 1 --branch "$ref" "$repo" ../wealthtrack-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:cov
      - run: npm audit
